name: Security and integration checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/check-public-boundaries.py
      - run: python -m unittest discover -s scripts/tests -v
      - name: Install the schema parser used by the diagnostic runner
        run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s lab/offensive -v
      - run: python -m unittest discover -s lab/purple/tests -v
      - run: python -m unittest discover -s lab/purple/collector -v
      - run: node --test scripts/practice-audit-proxy.test.mjs

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: PostgreSQL integration tests in disposable containers
        run: sh scripts/local-test.sh
      - name: Python range bridge tests (no AWS credentials)
        run: |
          python3 -m venv /tmp/range-tests
          /tmp/range-tests/bin/pip install -r lab/attack-range/requirements-bridge.txt
          /tmp/range-tests/bin/python -m unittest discover -s lab/attack-range/tests -v

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile static UI and embedded Go server
        run: docker build --target go-build -f Dockerfile.local .
